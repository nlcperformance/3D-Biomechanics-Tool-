<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Level PE Biomechanics: 3D Explorer (OCR H555/01)</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dyslexia-Friendly Font: Lexend -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Lexend', sans-serif; background-color: #0b0f19; color: #f1f5f9; letter-spacing: 0.02em; line-height: 1.6; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Custom Scrollbar */
        .sidebar-scroll::-webkit-scrollbar { width: 8px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: #111827; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        .nav-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-btn.active { 
            background-color: #3b82f6; 
            color: white; 
            border-color: #60a5fa; 
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6); 
        }
        
        /* Premium range slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            height: 22px; 
            width: 22px; 
            border-radius: 50%; 
            background: #3b82f6; 
            border: 2px solid #ffffff;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.8);
            cursor: pointer; 
            margin-top: -8px; 
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #374151; border-radius: 3px; }
        
        .keyword { font-weight: 700; color: #60a5fa; text-shadow: 0 0 8px rgba(96, 165, 250, 0.2); }
        .definition { font-size: 0.85rem; color: #cbd5e1; font-style: normal; display: block; margin-top: 0.4rem; margin-bottom: 0.4rem; padding-left: 0.75rem; border-left: 3px solid #3b82f6; background: rgba(59, 130, 246, 0.1); border-radius: 0 0.25rem 0.25rem 0; padding-top: 0.25rem; padding-bottom: 0.25rem; line-height: 1.4; }
        .examiner-tip { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.1); padding: 1rem; margin-top: 1rem; border-radius: 0 0.5rem 0.5rem 0; font-size: 0.95rem; font-weight: 500; box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.05); }
        
        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="antialiased text-sm">

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        
        <!-- Left Sidebar (Controls & Theory) -->
        <div class="w-full md:w-5/12 lg:w-4/12 xl:w-3/12 h-full glass-panel flex flex-col pointer-events-auto shadow-2xl">
            
            <div class="p-5 border-b border-slate-800">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-bold tracking-widest text-blue-500 uppercase">OCR H555/01 Spec</span>
                    <span class="px-2 py-0.5 bg-blue-500/10 text-blue-400 text-[10px] font-semibold rounded border border-blue-500/20">A-Level PE</span>
                </div>
                <h2 class="text-2xl font-black text-white tracking-tight">Biomechanics 3D Lab</h2>
            </div>

            <!-- Navigation Grid -->
            <div class="grid grid-cols-2 gap-1.5 p-3 bg-slate-950/40 border-b border-slate-800">
                <button onclick="switchModule(1)" id="btn-mod-1" class="nav-btn active py-2 px-1 text-xs font-bold rounded-lg border border-slate-800 hover:bg-slate-800/60 text-slate-300">Axes & Planes</button>
                <button onclick="switchModule(2)" id="btn-mod-2" class="nav-btn py-2 px-1 text-xs font-bold rounded-lg border border-slate-800 hover:bg-slate-800/60 text-slate-300">Angular Mom.</button>
                <button onclick="switchModule(4)" id="btn-mod-4" class="nav-btn py-2 px-1 text-xs font-bold rounded-lg border border-slate-800 hover:bg-slate-800/60 text-yellow-400">Forces & Stability</button>
                <button onclick="switchModule(3)" id="btn-mod-3" class="nav-btn py-2 px-1 text-xs font-bold rounded-lg border border-slate-800 hover:bg-slate-800/60 text-slate-300">Magnus Effect</button>
                <button onclick="switchModule(5)" id="btn-mod-5" class="nav-btn col-span-2 py-2 px-1 text-xs font-bold rounded-lg border border-emerald-500/30 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 tracking-wide">Linear Motion & V-T Graphs</button>
            </div>

            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-y-auto sidebar-scroll p-5" id="module-content">
                <!-- Content injected via JS -->
            </div>
        </div>

        <!-- Right Side Overlays (Dynamic Legend & Interactions) -->
        <div class="flex-1 relative hidden md:flex flex-col justify-between p-6 items-end">
            <!-- Dynamic Legend Panel -->
            <div id="legend-panel" class="bg-slate-950/90 backdrop-blur border border-slate-800 p-4 rounded-xl text-xs space-y-2.5 w-72 shadow-2xl pointer-events-auto">
                <!-- Dynamically loaded content based on selected module -->
            </div>

            <!-- Interactivity Help Overlay -->
            <div class="bg-slate-950/80 backdrop-blur border border-slate-800 p-3 rounded-lg pointer-events-auto text-xs text-slate-400 shadow-lg">
                <p>🖱️ <b>Left Click + Drag</b> to rotate camera</p>
                <p>🔍 <b>Scroll</b> to zoom in/out</p>
                <p>⚙️ <b>Right Click + Drag</b> to pan workspace</p>
            </div>
        </div>
    </div>

<script>
    // ==========================================
    // THREE.JS SETUP & SCENE INITIALIZATION
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0d14); 
    scene.fog = new THREE.Fog(0x0a0d14, 15, 60);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5, 3, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
    dirLight.position.set(8, 15, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Glowing Neon Grid Helper
    const gridHelper = new THREE.GridHelper(30, 30, 0x1d4ed8, 0x1e293b);
    scene.add(gridHelper);

    // ==========================================
    // 3D ASSETS CREATION
    // ==========================================

    // 1. HUMANOID MODEL (Enhanced with high contrast segments)
    const humanGroup = new THREE.Group();
    humanGroup.position.y = 1.5; 
    scene.add(humanGroup);

    const bodyMat = new THREE.MeshPhongMaterial({ color: 0x3b82f6, shininess: 50, specular: 0x60a5fa });
    const limbMat = new THREE.MeshPhongMaterial({ color: 0x1d4ed8, shininess: 40 });
    
    function createLimb(width, length, depth, material, yOffset) {
        const group = new THREE.Group();
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, length, depth), material);
        mesh.position.y = yOffset; 
        mesh.castShadow = true;
        group.add(mesh);
        return group;
    }

    // Torso
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.2, 0.35), bodyMat);
    torso.castShadow = true;
    humanGroup.add(torso);

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 20, 20), bodyMat);
    head.position.y = 0.88;
    humanGroup.add(head);

    // Arms
    const leftShoulder = new THREE.Group(); leftShoulder.position.set(-0.5, 0.5, 0);
    const leftUpperArm = createLimb(0.18, 0.6, 0.18, limbMat, -0.3); leftShoulder.add(leftUpperArm);
    const leftElbow = new THREE.Group(); leftElbow.position.set(0, -0.6, 0);
    const leftLowerArm = createLimb(0.14, 0.5, 0.14, limbMat, -0.25); leftElbow.add(leftLowerArm);
    leftUpperArm.add(leftElbow); humanGroup.add(leftShoulder);

    const rightShoulder = new THREE.Group(); rightShoulder.position.set(0.5, 0.5, 0);
    const rightUpperArm = createLimb(0.18, 0.6, 0.18, limbMat, -0.3); rightShoulder.add(rightUpperArm);
    const rightElbow = new THREE.Group(); rightElbow.position.set(0, -0.6, 0);
    const rightLowerArm = createLimb(0.14, 0.5, 0.14, limbMat, -0.25); rightElbow.add(rightLowerArm);
    rightUpperArm.add(rightElbow); humanGroup.add(rightShoulder);

    // Legs
    const leftHip = new THREE.Group(); leftHip.position.set(-0.25, -0.6, 0);
    const leftUpperLeg = createLimb(0.22, 0.7, 0.22, limbMat, -0.35); leftHip.add(leftUpperLeg);
    const leftKnee = new THREE.Group(); leftKnee.position.set(0, -0.7, 0);
    const leftLowerLeg = createLimb(0.18, 0.6, 0.18, limbMat, -0.3); leftKnee.add(leftLowerLeg);
    leftUpperLeg.add(leftKnee); humanGroup.add(leftHip);

    const rightHip = new THREE.Group(); rightHip.position.set(0.25, -0.6, 0);
    const rightUpperLeg = createLimb(0.22, 0.7, 0.22, limbMat, -0.35); rightHip.add(rightUpperLeg);
    const rightKnee = new THREE.Group(); rightKnee.position.set(0, -0.7, 0);
    const rightLowerLeg = createLimb(0.18, 0.6, 0.18, limbMat, -0.3); rightKnee.add(rightLowerLeg);
    rightUpperLeg.add(rightKnee); humanGroup.add(rightHip);

    // Center of Mass (CoM) neon marker
    const comMarker = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), new THREE.MeshBasicMaterial({color: 0xffe814}));
    humanGroup.add(comMarker);

    // --- MODULE 1: AXES & PLANES ---
    const axisGroup = new THREE.Group();
    humanGroup.add(axisGroup);
    
    // Colorful Glowing Axes
    const matLong = new THREE.LineBasicMaterial({ color: 0x22c55e, linewidth: 4 }); // Longitudinal (Green)
    const matTrans = new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 4 }); // Transverse (Red)
    const matFront = new THREE.LineBasicMaterial({ color: 0x3b82f6, linewidth: 4 }); // Frontal (Blue)
    
    const lineLong = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -3, 0), new THREE.Vector3(0, 3, 0)]), matLong);
    const lineTrans = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-3, 0, 0), new THREE.Vector3(3, 0, 0)]), matTrans);
    const lineFront = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, -3), new THREE.Vector3(0, 0, 3)]), matFront);
    axisGroup.add(lineLong, lineTrans, lineFront);

    // High Visual Planes
    const planeGeo = new THREE.PlaneGeometry(3.6, 3.6);
    const planeMatFrontal = new THREE.MeshBasicMaterial({color: 0x3b82f6, transparent: true, opacity: 0.15, side: THREE.DoubleSide, depthWrite: false});
    const planeMatSagittal = new THREE.MeshBasicMaterial({color: 0xef4444, transparent: true, opacity: 0.15, side: THREE.DoubleSide, depthWrite: false});
    const planeMatTransverse = new THREE.MeshBasicMaterial({color: 0x22c55e, transparent: true, opacity: 0.15, side: THREE.DoubleSide, depthWrite: false});

    const frontalPlane = new THREE.Mesh(planeGeo, planeMatFrontal);
    const sagittalPlane = new THREE.Mesh(planeGeo, planeMatSagittal); sagittalPlane.rotation.y = Math.PI / 2;
    const transversePlane = new THREE.Mesh(planeGeo, planeMatTransverse); transversePlane.rotation.x = Math.PI / 2;
    axisGroup.add(frontalPlane, sagittalPlane, transversePlane);
    frontalPlane.visible = sagittalPlane.visible = transversePlane.visible = false;

    // --- MODULE 4: STABILITY & FBD ---
    const stabilityGroup = new THREE.Group();
    scene.add(stabilityGroup);

    // Neon Base of Support
    const bosGeo = new THREE.PlaneGeometry(1, 0.6);
    const bosMat = new THREE.MeshBasicMaterial({color: 0xeab308, transparent: true, opacity: 0.45, side: THREE.DoubleSide});
    const bosMesh = new THREE.Mesh(bosGeo, bosMat);
    bosMesh.rotation.x = -Math.PI / 2;
    bosMesh.position.y = 0.01; 
    stabilityGroup.add(bosMesh);

    // Neon Line of Gravity
    const logMat = new THREE.LineDashedMaterial({ color: 0xffe814, dashSize: 0.15, gapSize: 0.1 });
    const logGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 1.5, 0), new THREE.Vector3(0, 0, 0)]);
    const logLine = new THREE.Line(logGeo, logMat);
    logLine.computeLineDistances();
    stabilityGroup.add(logLine);

    // Free Body Diagram Arrows
    const weightArrow = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(0, 1.5, 0), 1.5, 0xef4444, 0.3, 0.2);
    const reactLeftArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(-0.25, 0, 0), 0.75, 0x22c55e, 0.2, 0.15);
    const reactRightArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0.25, 0, 0), 0.75, 0x22c55e, 0.2, 0.15);
    stabilityGroup.add(weightArrow, reactLeftArrow, reactRightArrow);
    weightArrow.visible = reactLeftArrow.visible = reactRightArrow.visible = false; 

    // --- MODULE 3: MAGNUS EFFECT & TRAJECTORY ---
    const magnusGroup = new THREE.Group();
    magnusGroup.position.y = 1.5;
    scene.add(magnusGroup);
    
    // Stylized ball with clean high-contrast texture mapping
    const ballGeo = new THREE.SphereGeometry(0.8, 32, 16);
    const canvasB = document.createElement('canvas');
    canvasB.width = 256; canvasB.height = 256;
    const ctxB = canvasB.getContext('2d');
    ctxB.fillStyle = '#10b981'; ctxB.fillRect(0,0,256,256); // bright emerald
    ctxB.fillStyle = '#ffffff'; ctxB.fillRect(0, 110, 256, 36);
    const ballTex = new THREE.CanvasTexture(canvasB);
    const ballMat = new THREE.MeshStandardMaterial({ map: ballTex, roughness: 0.5 });
    const ball = new THREE.Mesh(ballGeo, ballMat);
    magnusGroup.add(ball);

    // Applied Force Strike Arrow
    const strikeArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(-2.2, 0, 0), 1.2, 0xd946ef, 0.4, 0.3);
    magnusGroup.add(strikeArrow);

    const arrowGroup = new THREE.Group();
    magnusGroup.add(arrowGroup);
    let airflowArrows = [];
    function createAirflowArrow(yPos, colorHex) {
        const arrow = new THREE.ArrowHelper(new THREE.Vector3(-1, 0, 0), new THREE.Vector3(2, yPos, 0), 1.5, colorHex, 0.3, 0.2);
        arrowGroup.add(arrow);
        return arrow;
    }
    const topAir1 = createAirflowArrow(1.2, 0xffffff);
    const topAir2 = createAirflowArrow(0.9, 0xffffff);
    const botAir1 = createAirflowArrow(-0.9, 0xffffff);
    const botAir2 = createAirflowArrow(-1.2, 0xffffff);
    airflowArrows = [topAir1, topAir2, botAir1, botAir2];

    const forceArrow = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(0,0,0), 2, 0xef4444, 0.5, 0.5);
    magnusGroup.add(forceArrow);

    // Interactive Trajectory Line showing the curved path path of the ball
    const trajectoryMat = new THREE.LineDashedMaterial({ color: 0x60a5fa, dashSize: 0.1, gapSize: 0.05 });
    const trajectoryGeo = new THREE.BufferGeometry();
    const trajectoryLine = new THREE.Line(trajectoryGeo, trajectoryMat);
    magnusGroup.add(trajectoryLine);

    // --- MODULE 5: LINEAR MOTION & TRACK ---
    const trackGroup = new THREE.Group();
    scene.add(trackGroup);
    trackGroup.visible = false;

    // Runway / Sprint Track mesh
    const trackGeo = new THREE.BoxGeometry(16, 0.1, 2);
    const trackMat = new THREE.MeshPhongMaterial({ color: 0x1e293b });
    const trackMesh = new THREE.Mesh(trackGeo, trackMat);
    trackMesh.position.set(0, -0.05, 0);
    trackMesh.receiveShadow = true;
    trackGroup.add(trackMesh);

    // Neon lane lines
    const lineGeo = new THREE.BoxGeometry(16, 0.02, 0.05);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const laneLine1 = new THREE.Mesh(lineGeo, lineMat); laneLine1.position.set(0, 0.01, 0.8);
    const laneLine2 = new THREE.Mesh(lineGeo, lineMat); laneLine2.position.set(0, 0.01, -0.8);
    trackGroup.add(laneLine1, laneLine2);

    // Distance markers
    for (let i = -7; i <= 7; i += 3.5) {
        const markerGeo = new THREE.BoxGeometry(0.1, 0.05, 2);
        const markerMesh = new THREE.Mesh(markerGeo, lineMat);
        markerMesh.position.set(i, 0.01, 0);
        trackGroup.add(markerMesh);
    }

    // ==========================================
    // APP STATE & SYSTEM CONFIG
    // ==========================================
    let currentModule = 1;
    let activeAxis = 'none'; 
    let tuckFactor = 0; 
    let stanceFactor = 0; 
    let showFBD = false;
    let angularMomentum = 500; 
    let maxMI = 100; 
    let minMI = 25;  
    let currentMI = maxMI;
    let angularVelocity = angularMomentum / currentMI;
    
    // Magnus State
    let strikeOffset = 0; 

    // Linear Motion State
    let sprinterTime = 0;
    let sprinterVelocity = 0;
    let sprinterPos = -7; 
    let linearMotionPhase = 'acceleration'; 
    let isSprinterRunning = false;
    let sprinterGaitPhase = 0; // State-integrated phase accumulator for perfect gait speed integration

    // ==========================================
    // MODULE 5: REAL-TIME GRAPH CONTROLLER
    // ==========================================
    function drawVelocityTimeGraph() {
        const canvas = document.getElementById('vt-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        // Draw Axes
        ctx.strokeStyle = '#4b5563';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(40, 10);
        ctx.lineTo(40, H - 30); // Y-axis
        ctx.lineTo(W - 15, H - 30); // X-axis
        ctx.stroke();

        // Labels
        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px Inter';
        ctx.fillText('Velocity (m/s)', 10, 20);
        ctx.fillText('Time (s)', W - 50, H - 15);

        // Helper curve formula:
        // 0s -> 3s Acceleration (Curve up)
        // 3s -> 6s Constant Velocity (Plateau)
        // 6s -> 9s Deceleration (Slowing down)
        const getVForT = (t) => {
            if (t < 3) return (t / 3) * 8; 
            if (t < 6) return 8; 
            if (t <= 9) return 8 - ((t - 6) / 3) * 8; 
            return 0;
        };

        ctx.strokeStyle = '#10b981'; // Neon green path
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let x = 0; x <= 100; x++) {
            const t = (x / 100) * 9;
            const v = getVForT(t);
            const graphX = 40 + (t / 9) * (W - 65);
            const graphY = (H - 30) - (v / 10) * (H - 50);
            if (x === 0) ctx.moveTo(graphX, graphY);
            else ctx.lineTo(graphX, graphY);
        }
        ctx.stroke();

        // Highlight regions
        ctx.fillStyle = 'rgba(59, 130, 246, 0.05)';
        ctx.fillRect(40, 10, (3/9)*(W-65), H-40); // Accel area
        ctx.fillStyle = 'rgba(234, 179, 8, 0.05)';
        ctx.fillRect(40 + (3/9)*(W-65), 10, (3/9)*(W-65), H-40); // Cruise area
        ctx.fillStyle = 'rgba(239, 68, 68, 0.05)';
        ctx.fillRect(40 + (6/9)*(W-65), 10, (3/9)*(W-65), H-40); // Decel area

        // Draw synchronized glowing dot for current time
        const currentV = getVForT(sprinterTime);
        const dotX = 40 + (sprinterTime / 9) * (W - 65);
        const dotY = (H - 30) - (currentV / 10) * (H - 50);

        ctx.shadowBlur = 10;
        ctx.shadowColor = '#10b981';
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(dotX, dotY, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; // reset
    }

    // ==========================================
    // DYNAMIC LEGEND SYSTEM
    // ==========================================
    function updateLegend(mod) {
        const legend = document.getElementById('legend-panel');
        if (!legend) return;
        
        let html = ``;
        if (mod === 1) {
            html = `
                <h4 class="font-bold text-slate-200 border-b border-slate-800 pb-1.5 mb-2 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span> Visual Key: Axes & Planes
                </h4>
                <div class="flex items-center gap-3">
                    <span class="w-3.5 h-1.5 bg-[#ef4444] block"></span>
                    <span class="text-slate-300">Transverse Axis / Sagittal Plane (Somersault)</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="w-3.5 h-1.5 bg-[#22c55e] block"></span>
                    <span class="text-slate-300">Longitudinal Axis / Transverse Plane (Spin)</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="w-3.5 h-1.5 bg-[#3b82f6] block"></span>
                    <span class="text-slate-300">Frontal Axis / Frontal Plane (Cartwheel)</span>
                </div>
            `;
        } else if (mod === 2) {
            html = `
                <h4 class="font-bold text-slate-200 border-b border-slate-800 pb-1.5 mb-2 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-purple-500"></span> Visual Key: Angular Momentum
                </h4>
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 rounded-full bg-[#ffe814] block"></span>
                    <span class="text-slate-300">Centre of Mass</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 rounded-sm bg-[#ef4444] block"></span>
                    <span class="text-slate-300">High Moment of Inertia (Straight Shape)</span>
                </div>
                <div class="flex items-center gap-3">

    // ==========================================

    function resetHumanPose() {
        humanGroup.rotation.set(0,0,0);
        humanGroup.position.set(0, 1.5, 0);
        leftShoulder.rotation.set(0,0,0); rightShoulder.rotation.set(0,0,0);

        tuckFactor = 0; stanceFactor = 0; showFBD = false;
        weightArrow.visible = reactLeftArrow.visible = reactRightArrow.visible = false;
        
        frontalPlane.visible = sagittalPlane.visible = transversePlane.visible = false;
        lineLong.visible = lineTrans.visible = lineFront.visible = true;
    }

    window.switchModule = function(mod) {
        currentModule = mod;
        
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`btn-mod-${mod}`);
        if (activeBtn) activeBtn.classList.add('active');
        
        moduleContainer.innerHTML = uiContent[mod];

        activeAxis = 'none';
        resetHumanPose();
        resetSprinter();
        updateLegend(mod);

        if (mod === 1) {
            humanGroup.visible = true; axisGroup.visible = true;
            stabilityGroup.visible = false; magnusGroup.visible = false; trackGroup.visible = false;
            camera.position.set(5, 3, 7);
        } 
        else if (mod === 2) {
            humanGroup.visible = true; axisGroup.visible = false;
            stabilityGroup.visible = false; magnusGroup.visible = false; trackGroup.visible = false;
            camera.position.set(6, 2, 0); 
            setAxis('transverse'); 
            updateTuck(0); 
        }
        else if (mod === 4) {
            humanGroup.visible = true; axisGroup.visible = false;
            stabilityGroup.visible = true; magnusGroup.visible = false; trackGroup.visible = false;
            camera.position.set(0, 2, 6);
            updateStance(0);
        }
        else if (mod === 3) {
            humanGroup.visible = false; axisGroup.visible = false;
            stabilityGroup.visible = false; magnusGroup.visible = true; trackGroup.visible = false;
            camera.position.set(0, 0, 6);
            updateStrikePoint(0); 
        }
        else if (mod === 5) {
            humanGroup.visible = true; axisGroup.visible = false;
            stabilityGroup.visible = false; magnusGroup.visible = false; trackGroup.visible = true;
            camera.position.set(0, 3, 8);
            controls.target.set(0, 1, 0);
            drawVelocityTimeGraph();
        }
    };

    // Mod 1
    window.setAxis = function(axis) {
        activeAxis = axis;
        humanGroup.rotation.set(0,0,0);
        
        frontalPlane.visible = sagittalPlane.visible = transversePlane.visible = false;
        lineLong.visible = lineTrans.visible = lineFront.visible = false; 
        
        if(axis === 'transverse') {
            sagittalPlane.visible = true; 
            lineTrans.visible = true;     
        } else if (axis === 'longitudinal') {
            transversePlane.visible = true; 
            lineLong.visible = true;
        } else if (axis === 'frontal') {
            frontalPlane.visible = true;
            lineFront.visible = true;
        }
    };

    // Mod 2
    window.updateTuck = function(val) {
        tuckFactor = parseFloat(val);
        
        leftShoulder.rotation.x = -tuckFactor * 2.8; rightShoulder.rotation.x = -tuckFactor * 2.8;
        leftElbow.rotation.x = -tuckFactor * 1.5; rightElbow.rotation.x = -tuckFactor * 1.5;
        leftHip.rotation.x = -tuckFactor * 2.2; rightHip.rotation.x = -tuckFactor * 2.2;
        leftKnee.rotation.x = tuckFactor * 2.5; rightKnee.rotation.x = tuckFactor * 2.5;

        currentMI = maxMI - (tuckFactor * (maxMI - minMI));
        angularVelocity = angularMomentum / currentMI;

        if(document.getElementById('val-mi')) {
            document.getElementById('val-mi').innerText = currentMI.toFixed(1);
            document.getElementById('bar-mi').style.width = `${(currentMI / maxMI) * 100}%`;
            document.getElementById('val-av').innerText = angularVelocity.toFixed(1);
            const maxAV = angularMomentum / minMI;
            document.getElementById('bar-av').style.width = `${(angularVelocity / maxAV) * 100}%`;
            document.getElementById('bar-mi').style.backgroundColor = tuckFactor > 0.5 ? '#10b981' : '#ef4444';
            document.getElementById('bar-av').style.backgroundColor = tuckFactor > 0.5 ? '#ef4444' : '#10b981'; 
        }
    };

    // Mod 4: Stability & Forces
    window.updateStance = function(val) {
        stanceFactor = parseFloat(val);
        humanGroup.position.y = 1.5 - (stanceFactor * 0.4);
        leftHip.rotation.z = -stanceFactor * 0.5;
        rightHip.rotation.z = stanceFactor * 0.5;
        leftKnee.rotation.z = stanceFactor * 0.5;
        rightKnee.rotation.z = -stanceFactor * 0.5;

        const spread = 0.5 + (stanceFactor * 0.8);
        bosMesh.scale.set(spread, 1, 1);
        updateForcesPosition();
    };

    window.toggleFBD = function() {
        showFBD = !showFBD;
        weightArrow.visible = reactLeftArrow.visible = reactRightArrow.visible = showFBD;
        const btn = document.getElementById('btn-fbd');
        const desc = document.getElementById('fbd-desc');
        
        if(showFBD) {
            btn.innerText = "Hide Free Body Diagram";
            btn.classList.replace('bg-slate-800', 'bg-blue-600');
            desc.classList.remove('hidden');
            updateForcesPosition();
        } else {
            btn.innerText = "Show Free Body Diagram";
            btn.classList.replace('bg-blue-600', 'bg-slate-800');
            desc.classList.add('hidden');
        }
    };

    function updateForcesPosition() {
        const comY = humanGroup.position.y;
        logGeo.setFromPoints([new THREE.Vector3(0, comY, 0), new THREE.Vector3(0, 0, 0)]);
        logLine.computeLineDistances();
        weightArrow.position.set(0, comY, 0); 
        const footX = 0.25 + (stanceFactor * 0.4);
        reactLeftArrow.position.set(-footX, 0, 0);
        reactRightArrow.position.set(footX, 0, 0);
    }

    // Mod 3: Interactive Magnus Effect
    window.updateStrikePoint = function(val) {
        strikeOffset = parseFloat(val);
        strikeArrow.position.y = strikeOffset * 0.8;

        const expDiv = document.getElementById('magnus-explanation');

        // Dynamic trajectory plotting points based on spin state
        const points = [];
        const startX = -3;
        for (let i = 0; i < 40; i++) {
            const x = startX + (i * 0.15);
            // Parabolic curve with offset deviation
            let y = 0;
            if (strikeOffset > 0.1) {
                y = -Math.pow(x + 1, 2) * 0.08 * strikeOffset; // Curves Down
            } else if (strikeOffset < -0.1) {
                y = Math.pow(x + 1, 2) * 0.08 * Math.abs(strikeOffset); // Curves Up
            }
            points.push(new THREE.Vector3(x, y, 0));
        }
        trajectoryGeo.setFromPoints(points);
        trajectoryLine.computeLineDistances();

        if (strikeOffset > 0.1) {
            forceArrow.visible = true;
            forceArrow.setDirection(new THREE.Vector3(0, -1, 0)); 
            forceArrow.setColor(new THREE.Color(0xef4444)); 
            expDiv.innerHTML = `
                <h4 class="font-bold text-red-400 mb-3 text-base">Topspin (Eccentric Force Above CoM)</h4>
                <ul class="list-disc pl-5 text-sm text-slate-200 space-y-3 font-medium leading-relaxed">
                    <li><b>Top of ball:</b> Airflow opposes spin &rarr; Velocity decreases, so Pressure <b>increases</b>.</li>
                    <li><b>Bottom of ball:</b> Airflow moves with spin &rarr; Velocity increases, so Pressure <b>decreases</b> (Bernoulli's Principle).</li>
                    <li><b>Result:</b> Pressure Gradient forces the ball <b>DOWNWARDS</b>.</li>
                </ul>`;
            topAir1.setColor(0xef4444); topAir2.setColor(0xef4444); 
            botAir1.setColor(0x10b981); botAir2.setColor(0x10b981); 

        } else if (strikeOffset < -0.1) {
            forceArrow.visible = true;
            forceArrow.setDirection(new THREE.Vector3(0, 1, 0)); 
            forceArrow.setColor(new THREE.Color(0x10b981)); 
            expDiv.innerHTML = `
                <h4 class="font-bold text-emerald-400 mb-3 text-base">Backspin (Eccentric Force Below CoM)</h4>
                <ul class="list-disc pl-5 text-sm text-slate-200 space-y-3 font-medium leading-relaxed">
                    <li><b>Top of ball:</b> Airflow moves with spin &rarr; Velocity increases, so Pressure <b>decreases</b> (Bernoulli's Principle).</li>
                    <li><b>Bottom of ball:</b> Airflow opposes spin &rarr; Velocity decreases, so Pressure <b>increases</b>.</li>
                    <li><b>Result:</b> Pressure Gradient forces the ball <b>UPWARDS</b>.</li>
                </ul>`;
            topAir1.setColor(0x10b981); topAir2.setColor(0x10b981); 
            botAir1.setColor(0xef4444); botAir2.setColor(0xef4444); 
            
        } else {
            forceArrow.visible = false;
            expDiv.innerHTML = `
                <h4 class="font-bold text-slate-300 mb-3 text-base">No Spin (Concentric Force)</h4>
                <p class="text-sm text-slate-200 font-medium leading-relaxed">Applying force exactly through the <span class="keyword">Centre of Mass</span> creates a <b>Concentric Force</b>. Air velocity is equal on both sides, so there is no pressure gradient and therefore no Magnus effect.</p>
            `;
            topAir1.setColor(0xffffff); topAir2.setColor(0xffffff); 
            botAir1.setColor(0xffffff); botAir2.setColor(0xffffff); 
        }
    };

    // Mod 5: Sprinter System
    window.toggleSprinter = function() {
        isSprinterRunning = !isSprinterRunning;
        const btn = document.getElementById('btn-sprint-play');
        if (isSprinterRunning) {
            btn.innerText = "Pause";
            btn.classList.replace('bg-emerald-600', 'bg-red-600');
        } else {
            btn.innerText = "Resume Sprinter";
            btn.classList.replace('bg-red-600', 'bg-emerald-600');
        }
    };

    window.resetSprinter = function() {
        isSprinterRunning = false;
        sprinterTime = 0;
        sprinterPos = -7;
        sprinterVelocity = 0;
        sprinterGaitPhase = 0;
        linearMotionPhase = 'acceleration';
        const btn = document.getElementById('btn-sprint-play');
        if (btn) {
            btn.innerText = "Start Sprinter";
            btn.classList.replace('bg-red-600', 'bg-emerald-600');
        }
        humanGroup.position.set(-7, 1.4, 0);
        leftHip.rotation.x = 0; rightHip.rotation.x = 0;
        leftShoulder.rotation.x = 0; rightShoulder.rotation.x = 0;
        
        // Face forward along the track (X-axis) instead of facing sideways
        if (currentModule === 5) {
            humanGroup.rotation.y = Math.PI / 2;
        }

        drawVelocityTimeGraph();
        updateSprintLabel('Static');
    };

    function updateSprintLabel(text) {
        const lbl = document.getElementById('sprint-phase-label');
        if (!lbl) return;
        lbl.innerText = text;
        if (text === 'Acceleration') lbl.className = "text-emerald-400 font-mono text-[10px] uppercase";
        else if (text === 'Constant Velocity') lbl.className = "text-yellow-400 font-mono text-[10px] uppercase";
        else if (text === 'Deceleration') lbl.className = "text-red-400 font-mono text-[10px] uppercase";
    }

    // ==========================================
    // ANIMATION & KINEMATICS LOOP
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const time = clock.getElapsedTime();

        controls.update();

        // Axis Rotating Loop
        if (currentModule === 1) {
            const speed = 2 * delta;
            if (activeAxis === 'longitudinal') humanGroup.rotation.y += speed;
            if (activeAxis === 'transverse') humanGroup.rotation.x -= speed; 
            if (activeAxis === 'frontal') humanGroup.rotation.z -= speed;
        } 
        else if (currentModule === 2) {
            const visualSpeed = angularVelocity * 0.15 * delta;
            humanGroup.rotation.x -= visualSpeed;
        }
        else if (currentModule === 3) {
            const ballSpinSpeed = 10 * delta * strikeOffset;
            ball.rotation.z -= ballSpinSpeed;

            airflowArrows.forEach((arrow, index) => {
                let speed = 2 * delta;
                if (strikeOffset > 0.1) { // Topspin
                    if (index < 2) speed *= 0.5; else speed *= 2.0;
                } else if (strikeOffset < -0.1) { // Backspin
                    if (index < 2) speed *= 2.0; else speed *= 0.5;
                }
                arrow.position.x -= speed;
                if (arrow.position.x < -3) arrow.position.x = 3;
                arrow.position.y += Math.sin(time * 5 + index) * 0.002;
            });
            strikeArrow.position.x = -2.2 + Math.sin(time * 8) * 0.05;
        }
        else if (currentModule === 5) {
            // Linear Motion Sprinter Engine
            if (isSprinterRunning) {
                sprinterTime += delta;
                
                // Track kinematics phases: 0-3s acceleration, 3-6s constant, 6-9s deceleration
                if (sprinterTime < 3) {
                    linearMotionPhase = 'acceleration';
                    sprinterVelocity = (sprinterTime / 3) * 8; 
                    updateSprintLabel('Acceleration');
                } else if (sprinterTime < 6) {
                    linearMotionPhase = 'cruise';
                    sprinterVelocity = 8; 
                    updateSprintLabel('Constant Velocity');
                } else if (sprinterTime < 9) {
                    linearMotionPhase = 'deceleration';
                    sprinterVelocity = 8 - ((sprinterTime - 6) / 3) * 8; 
                    updateSprintLabel('Deceleration');
                } else {
                    // Loop execution restart
                    sprinterTime = 0;
                    sprinterPos = -7;
                    sprinterGaitPhase = 0;
                }

                // Increment distance based on delta velocity integration
                sprinterPos += (sprinterVelocity * delta) * 0.25; // scaled down to fit virtual track space
                humanGroup.position.x = sprinterPos;

                // Physics-corrected Gait Engine
                // Rotate limbs relative to the body's local space (so they cycle forward/backward as they run)
                sprinterGaitPhase += sprinterVelocity * delta * 6.0;

                leftHip.rotation.x = Math.sin(sprinterGaitPhase) * 0.5;
                rightHip.rotation.x = -Math.sin(sprinterGaitPhase) * 0.5;
                leftShoulder.rotation.x = -Math.sin(sprinterGaitPhase) * 0.6;
                rightShoulder.rotation.x = Math.sin(sprinterGaitPhase) * 0.6;
                
                drawVelocityTimeGraph();
            }
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    const moduleContainer = document.getElementById('module-content');
    switchModule(1);
    animate();

</script>
</body>
</html>
